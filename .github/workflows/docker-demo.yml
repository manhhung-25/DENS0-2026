name: Docker demo

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - requirements-docker.txt
      - pose_focus_demo/**
      - research_pipeline/**
      - research_artifacts/benchmark.json
      - research_artifacts/comparison.csv
      - scripts/smoke_test_web.py
      - .github/workflows/docker-demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - name: Validate Compose and start CPU demo
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
      - name: Check HTTP workflow
        run: docker compose exec -T dashboard python scripts/smoke_test_web.py --state-file /data/smoke_check.json
      - name: Check persistence after restart
        run: |
          docker compose restart dashboard
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T dashboard python scripts/smoke_test_web.py --state-file /data/smoke_check.json --verify-persistence
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test instance
        if: always()
        run: docker compose down
